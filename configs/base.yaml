# configs/base.yaml
# Tham số dùng chung cho mọi phương án. Các file trong method/, ablation/, student/
# chỉ ghi phần khác biệt và được gộp đè lên file này (xem src/common/config.py).
#
# Giá trị đánh dấu [TẠM] chưa có căn cứ trong tài liệu thiết kế: phải chốt sau khi đo
# hoặc sau khi bàn với thầy, không được coi là đã quyết định.

project:
  name: qd-rsr
  data_seed: 42                 # seed rút mẫu câu hỏi (khớp lô pilot)
  train_seeds: [42, 43, 44]     # ba seed huấn luyện, báo cáo trung bình và độ lệch chuẩn

# Đường dẫn tương đối so với gốc repo
paths:
  data_raw: data/raw
  data_pilot: data/pilot
  data_stage_a: data/stage_a
  data_stage_b: data/stage_b
  data_rsr_ref: data/rsr_ref
  out_models: outputs/models
  out_results: outputs/results
  out_logs: outputs/logs
  out_figures: outputs/figures

# ---------------------------------------------------------------- Giai đoạn A: sinh chuỗi
generation:
  prompt_id: rsr                # "rsr" = cách sinh của bài gốc (Phụ lục A.2): chỉ dẫn nối vào cuối đề bài,
                                # vai trò user, không có system prompt. Nội dung ở src/common/prompts.py.
                                # "boxed" là cách cũ, chỉ dùng để sinh bù cho lô pilot đã chạy trước 19/09.
  samples_per_teacher: 3
  temperature: 0.8              # ĐÃ CHỐT. Bài gốc (A.2) dùng 0.6 với 11 teacher; nhóm chỉ có 3 teacher nên cần thêm
                                # đa dạng trong từng teacher. Đo trên toàn kho: khoảng cách trung vị giữa hai chuỗi
                                # cùng teacher 0.308, khác teacher 0.465 (a5_embed --probe).
  top_p: 0.95
  max_tokens: 3072              # ĐÃ CHỐT ở lô thử 4, bằng training.max_seq_len. Lô chạy thật đã dùng giá trị này
                                # (generation_runs.jsonl). Chuỗi bị cắt (finish_reason=length) bị loại ở a3
  max_workers: 3                # 8 luồng bị chặn tần suất trên bài MATH khó (Notion mục R5)
  max_attempts: 6               # số lần thử tối đa mỗi lượt gọi (BadRequest chỉ thử 2 lần)
  request_timeout_s: 180

# ---------------------------------------------------------------- Chất lượng Qual(t)
quality:
  alpha: 0.5                    # Qual = alpha * rule_norm + (1 - alpha) * llm_norm, mỗi nửa min-max trong từng câu hỏi
  # Trọng số theo bài RSR (Phụ lục B.2) và Notion mục B5/L5.
  # LƯU Ý: mục 6.8 trên trang DỰ ÁN CNTT còn ghi "bằng nhau, mỗi giá trị 0,25", mâu thuẫn với bảng ở mục 6.6.
  rule_weights:
    elaborated: 0.30            # tổng số từ
    self_verification: 0.20
    exploratory: 0.25
    adaptive: 0.25
  rule_keywords:                # đếm tần suất, chia cho tổng số từ, rồi chuẩn hoá z-score riêng từng tiêu chí
    self_verification: [check, verify]
    exploratory: [perhaps, might]
    adaptive: [therefore, since]

# ---------------------------------------------------------------- Chọn lọc (Giai đoạn B)
selection:
  k: 3                          # cấu hình chính. Cấu hình phụ k=1 dùng --override selection.k=1
  a: 1.0                        # số mũ của Fit. a=0 tắt Fit (ablation)
  b: 1.0                        # số mũ của Qual. b=0 tắt Qual (ablation)
  lambda_div: 0.4               # [TẠM] giá trị giữa lưới; λ thật chọn bằng huấn luyện trên validation_matched.jsonl
                                # (chỉ trên mô hình 1,5 tỷ; mô hình 7 tỷ dùng lại λ đó, không chọn lại)
  # Lưới chốt 29/09 bằng lambda_scan trên file fit .v1 (RSR không đổi định nghĩa), 1.776 câu có hơn 3 ứng viên.
  # Chênh lệch trung vị giữa tập tốt nhất và kém nhất trong một câu: Σ Fit·Qual 1,43, Div thô 0,76, nên hai vế
  # cùng cỡ. Tỷ lệ câu đổi tập so với λ = 0: 0,15 → 15%; 0,4 → 31%; 1,0 → 59% (ở 1,0 chỉ 10% câu trùng tập Div
  # lớn nhất). λ = 0 trùng biến thể Fit + Quality, dùng lại mô hình đó nên chọn λ chỉ tốn 3 lần huấn luyện.
  # Chạy lại lambda_scan với file fit mới để xác nhận.
  lambda_grid: [0.0, 0.15, 0.4, 1.0]
  # Div giữ nguyên (tổng khoảng cách, không min-max trong câu hỏi), đúng công thức Div(S) trong paper.
  # Min-max sẽ phóng chênh lệch rất nhỏ ở những câu mà mọi chuỗi gần giống nhau thành 0 đến 1, khiến Div đổi
  # tập vì nhiễu biểu diễn. Fit và Qual vẫn min-max trong câu hỏi (normalize bên dưới).
  div_scale: raw
  rsr_rank_cap: 100             # r_max của bài gốc
  # Seed cho mọi bước chọn ngẫu nhiên (Correct-Only, No-Filter). Cố định và KHÔNG gắn với seed huấn luyện,
  # để tập chọn của Correct-Only giống hệt nhau ở ba seed và ở cả hai mô hình học (chốt 30/09).
  random_seed: 42
  normalize: minmax_per_question

# Chiều tối ưu của từng tín hiệu khi chọn top-k. CHỈ RSR là min, còn lại đều là max.
# Đây là chỗ dễ cài nhầm nhất (Fit = 1 - minmax(RSR) chỉ áp dụng trong hàm mục tiêu QD-RSR).
signal_direction:
  rsr: min
  grape: max
  local_nat: max
  lark: max                     # xếp theo ĝ (tính theo câu hỏi ở signals.add_lark), không phải Brier
  token_length: max
  rule_quality: max
  llm_quality: max

# ---------------------------------------------------------------- Huấn luyện (Giai đoạn B, bước b3)
training:
  method: qlora
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  num_epochs: 3
  max_seq_len: 3072             # ĐÃ CHỐT, bằng generation.max_tokens. b1_fit cũng đọc giá trị này làm độ dài tối đa
                                # khi chấm tín hiệu: bản chạy b1 cũ dùng 2048 nên 383 chuỗi dài bị chấm trên đoạn đầu.
  # Kích thước lô đo bằng check_vram, ghi đè trong configs/student/*.yaml (batch_size, grad_accum).
  # Lô hiệu dụng 16 cho cả hai mô hình học. b3_train phải đọc đúng hai khoá batch_size và grad_accum.
  batch_size: 2
  grad_accum: 8
  gradient_checkpointing: true
  bf16: true

hardware:
  vram_budget_gb: 10            # không chạy sát trần 12GB (Notion mục B8)
  torch_memory_fraction: 0.85

# ---------------------------------------------------------------- Đánh giá (Giai đoạn C)
# ĐÃ CHỐT 30/09 theo Phụ lục A.4 bài RSR (đối chiếu cả v1 và v5, hai bản giống nhau).
eval:
  benchmarks: [gsm8k, math500, amc, aime24, aime25, bbh]
  n_samples: 4                  # 4 lượt sinh độc lập mỗi câu; mọi chỉ số tính từ đúng 4 lượt này
  # acc@4  = TRUNG BÌNH tỷ lệ đúng của 4 lượt (định nghĩa của bài RSR, A.4). Chỉ số chính.
  # pass@4 = đúng nếu có ít nhất một trong 4 lượt đúng. Phép thử riêng cho thành phần đa dạng.
  # Trước 30/09 tên hai chỉ số bị đặt ngược: "acc@4" ở đây từng là pass@4 và "acc@1" là acc@4 của RSR.
  report: [acc@4, pass@4]
  temperature: 0.6
  top_p: 0.95
  top_k: -1                     # tắt, như A.4
  max_new_tokens: 3072          # bằng training.max_seq_len, đúng nguyên tắc của A.4 (họ dùng 32.768 cho cả hai)
  on_truncation: keep           # câu trả lời vượt giới hạn bị cắt và chấm như bình thường, KHÔNG lấy mẫu lại

signals:
  # Local Naturalness (Just 2025, phương trình 2): mỗi câu được chấm khi mô hình chỉ thấy đề bài và tối đa
  # ngần này câu liền trước. 4 là giá trị bài gốc chọn (phụ lục B.4) và LARK dùng lại (phụ lục C.2).
  # Trước 29/09 mã dùng khối 256 token không chồng nhau, không có đề bài: sai định nghĩa, đã bỏ.
  local_steps: 4
  # true thì b1_fit không tính LocalNat (đắt gấp khoảng 5 lần phần còn lại). Chỉ bật cho mô hình học nào không
  # chạy phương án Local Naturalness; hiện là mô hình 7 tỷ (configs/student/qwen7b.yaml).
  skip_local_nat: false
  # Số vị trí xếp hạng mỗi lần trong b1. Xếp hạng phải so với toàn bộ 152.000 mục từ vựng, nên làm một
  # lần cho cả chuỗi tốn gần 8GB; chia đoạn 512 đưa xuống khoảng 1GB.
  rank_chunk: 512
