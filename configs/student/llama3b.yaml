# Mô hình học của Hướng 1 sau cổng sàn (đổi 07/11/2026). Llama-3.2-1B chỉ đạt 3,6% Acc@4 MATH-500 với Correct-Only
# seed 42, dưới cổng sàn 15% đã đăng ký, và kiểm tra cho thấy không phải lỗi mã (xem trang Notion tuần 11, mục 7).
# Llama-3.2-3B là mô hình Llama nhỏ còn lại cùng họ với mô hình dạy Llama-3.3-70B. Giả thuyết L0 đến L4, T2 và mọi
# quy tắc đã đăng ký giữ nguyên, áp lại cho mô hình học này. Cùng giấy phép Llama 3.2 nên quyền tải đã có.
student:
  key: llama3b
  model_id: meta-llama/Llama-3.2-3B-Instruct
  base_model_id: meta-llama/Llama-3.2-3B  # dùng khi chạy với cờ --base
  params_b: 3.21
  prompt_format: plain         # bản nền không có khuôn hội thoại, như llama1b

training:
  # Chốt 08/11/2026 sau check_vram: LoRA 16-bit chỉ đạt 33 token/giây (tràn bộ nhớ 12 GB, khoảng 90 giờ mỗi lần).
  # QLoRA 4-bit, lô 1: đỉnh 7,82 GB, 8,74 giây mỗi bước, 352 token/giây; lô 2 vượt 12 GB. Như qwen7b, Fam phải chấm
  # ở cùng độ chính xác: b1_fit chạy với --load-4bit. Kết quả 3B vì vậy không so từng điểm với Qwen 1,5B (16-bit).
  method: qlora
  load_in_4bit: true
  batch_size: 1
  grad_accum: 16               # lô hiệu dụng 16, bằng qwen1_5b và llama1b

signals:
  skip_local_nat: true         # các phương án của Hướng 1 không dùng LocalNat

# Llama-3.2-1B ở lô sinh 64, 32, 16 đã giữ chỗ 10,2 GB; 3B cần bộ đệm KV lớn hơn nên dùng cỡ lô của qwen7b.
# Cỡ lô chỉ đổi tốc độ, không đổi phân phối văn bản sinh ra.
eval:
  gen_batch: [32, 16, 8]

methods: [correct_only, grape]
