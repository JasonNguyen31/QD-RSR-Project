# configs/models.yaml
# Ba mô hình dạy, giám khảo, embedding. Tên biến môi trường chứa khoá nằm ở đây, KHÔNG ghi khoá vào file này.
# Khoá đặt trong .env ở gốc repo (đã có trong .gitignore).

openrouter:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY # đổi nếu .env của bạn dùng tên khác
  # Nếu gọi thử mà mọi lượt trả BadRequest thì đặt false: đây là trường yêu cầu OpenRouter trả kèm chi phí
  request_usage_cost: true

# Ngày truy cập và đường truy cập cần ghi vào phần Mô hình sử dụng của paper (bài học ở Notion mục J2).
teachers:
  - key: deepseek
    model_id: deepseek/deepseek-chat # DeepSeek-V3 qua OpenRouter
    provider_order: [] # để trống = OpenRouter tự chọn nhà cung cấp
  - key: qwen72b
    model_id: qwen/qwen-2.5-72b-instruct
    provider_order: [] # cân nhắc ghim nhà cung cấp nếu tỷ lệ phản hồi rỗng ~5% còn kéo dài
  - key: llama70b
    model_id: meta-llama/llama-3.3-70b-instruct
    provider_order: []

judge:
  # provider: "openrouter" hoặc "gemini" (API riêng của Google).
  # Chốt 19/09/2026: dùng openrouter. API riêng của Google trả 429 RESOURCE_EXHAUSTED sau vài chục lượt
  # vì hết hạn mức bậc miễn phí, không đủ cho 18.000 chuỗi. OpenRouter đã có tín dụng và chạy ổn định.
  # Nguyên tắc thiết kế không đổi: giám khảo vẫn thuộc họ kiến trúc độc lập với cả ba mô hình dạy.
  provider: openrouter
  model_id:
    google/gemini-2.5-flash-lite # [CẦN XÁC NHẬN] tên chính xác trên OpenRouter,
    # kiểm tra bằng: python -m src.tools.test_api --judge-compare
  compare_model_id: google/gemini-2.5-flash-lite # [CẦN XÁC NHẬN] bản rẻ hơn để so
  api_key_env: GEMINI_API_KEY # chỉ dùng khi provider = gemini
  max_tokens:
    4000 # nâng dần 1500 -> 3000 -> 4000 ngày 19/09. Trên bài mức 5,
    # Flash-Lite viết lý giải tới 10.000 ký tự nên JSON bị cắt dở.
    # Tăng ngưỡng KHÔNG làm tăng chi phí cho phản hồi ngắn,
    # vì chỉ tính tiền theo token thực sinh ra
  temperature: 0.0 # chấm điểm nên tất định, khác với lúc sinh chuỗi

embedding:
  model_id: BAAI/bge-m3
  device: mps # Mac. Bỏ qua nếu chạy nơi khác
  max_length: 2048
