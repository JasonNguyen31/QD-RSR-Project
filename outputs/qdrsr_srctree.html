<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QD-RSR — Cây mã nguồn</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#1c1b19;--dim:#6b6864;--line:#e2ddd6;--accent:#a8501e;
--soft:#f5e9e1;--done:#2f6b4f;--todo:#9a7a2c;--code:#f2efea;--warn:#fdf6e8;--warnline:#e0c274;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--panel:#1f1e23;--ink:#e9e6e1;
--dim:#9c9791;--line:#33313a;--accent:#e08b57;--soft:#2c2320;--done:#6db08c;--todo:#d4ab5a;
--code:#2a282f;--warn:#2e2718;--warnline:#6b5726}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#1f1e23;--ink:#e9e6e1;--dim:#9c9791;--line:#33313a;
--accent:#e08b57;--soft:#2c2320;--done:#6db08c;--todo:#d4ab5a;--code:#2a282f;--warn:#2e2718;--warnline:#6b5726}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 18px 64px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:.88rem;margin-bottom:18px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.8rem}
.stat b{color:var(--accent);font-size:.95rem}
h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:26px 0 10px;font-weight:600}
.flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.step{flex:0 0 auto;min-width:132px;background:var(--panel);border:1px solid var(--line);
border-left:3px solid var(--done);border-radius:8px;padding:9px 11px;cursor:pointer;transition:.15s}
.step.todo{border-left-color:var(--todo);opacity:.72}
.step:hover{border-color:var(--accent);transform:translateY(-2px)}
.step .k{font-size:.68rem;color:var(--dim);letter-spacing:.08em}
.step .n{font-weight:600;font-size:.83rem;margin:1px 0 3px}
.step .o{font-size:.7rem;color:var(--dim);line-height:1.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.72rem;color:var(--dim);margin:8px 0 4px;padding:0 4px}
.legend span{display:flex;align-items:center;gap:5px}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.tree,.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tree{padding:8px;max-height:72vh;overflow-y:auto}
@media(max-width:820px){.tree{max-height:46vh}}
.grp>summary{cursor:pointer;padding:7px 9px;border-radius:7px;font-weight:600;font-size:.8rem;

.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:var(--soft)}
.grp>summary::before{content:"\25B8";color:var(--dim);font-size:.75rem;transition:.15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.badge{font-size:.62rem;padding:1px 6px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600}
.files{padding:2px 0 6px 20px}
.file{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;
color:var(--ink);font:inherit;font-size:.78rem;padding:5px 9px;border-radius:6px;cursor:pointer;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.file:hover{background:var(--soft)}
.file.sel{background:var(--accent);color:#fff}
.file.sel .meta{color:rgba(255,255,255,.82)}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{font-size:.66rem;color:var(--dim);flex:0 0 auto}
.dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto;background:var(--done)}
.dot.empty{background:var(--todo)}.dot.legacy{background:var(--dim)}
.detail{padding:22px 24px;min-height:340px}
@media(max-width:820px){.detail{padding:18px}}
.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;color:var(--accent);
font-weight:600;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.tag{font-size:.68rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.on{background:var(--soft);color:var(--accent);border-color:transparent;font-weight:600}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:16px 0 5px;font-weight:600}
.role{font-size:1rem;font-weight:500}
.detail ul{margin:6px 0;padding-left:20px}.detail li{margin:4px 0}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.84em;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.note{background:var(--warn);border:1px solid var(--warnline);border-radius:8px;padding:11px 14px;
margin-top:14px;font-size:.88rem}
.note::before{content:"Ch\00FA \00FD  ";font-size:.66rem;letter-spacing:.09em;color:var(--dim);font-weight:700}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--dim);font:inherit;font-size:.85rem;font-weight:600;
padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.view{display:none}.view.on{display:block}
.cmd{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;
overflow-x:auto}
.cmd code{background:none;padding:0;font-size:.78rem;white-space:pre;display:block}
.why{font-size:.83rem;color:var(--dim);margin:-2px 0 12px 2px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:1rem}
.sec .intro{font-size:.88rem;color:var(--dim);margin-bottom:10px}
table.tune{width:100%;border-collapse:collapse;font-size:.83rem}
table.tune th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
padding:6px 8px;border-bottom:1px solid var(--line)}
table.tune td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tune td:nth-child(2){font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);white-space:nowrap}
table.tune td:nth-child(3){color:var(--dim)}
.empty-state{color:var(--dim);font-size:.9rem;text-align:center;padding:70px 20px}

k --workers 4 --max-cost 12", "Lô 1"], ["caffeinate -i python -m src.stage_a.a2_generate --workdir data/stage_a --teachers qwen72b --shard qwen72b --workers 4 --max-cost 12", "Lô 2"], ["caffeinate -i python -m src.stage_a.a2_generate --workdir data/stage_a --teachers llama70b --shard llama70b --workers 4 --max-cost 12", "Lô 3"], ["wc -l data/stage_a/trajectories.*.jsonl data/stage_a/failures.*.jsonl", "Cửa sổ thứ tư để theo dõi. Mỗi lô cần 6.000 dòng chuỗi."]]], ["4. a3_filter — gán nhãn và lọc", "a3 sẽ DỪNG khi có câu hỏi thiếu chuỗi. Đó là hành vi đúng, không phải hỏng: chạy lại ba lệnh a2 để sinh bù rồi mới chạy a3.", [["python -m src.stage_a.a3_filter --workdir data/stage_a", "Miễn phí."]]], ["5. a4 và a5 — chấm điểm", "Chạy thử ở quy mô nhỏ trước, rồi mới chạy đầy đủ.", [["python -m src.stage_a.a4_score_quality --workdir data/stage_a --rule-only", "Miễn phí, vài giây."], ["python -m src.stage_a.a5_embed --workdir data/stage_a --limit 500 --probe", "Ước thời gian, cục bộ."], ["python -m src.stage_a.a4_score_quality --workdir data/stage_a --limit 200 --max-cost 1", "Ước chi phí thật trên phân bố thật."], ["python -m src.stage_a.a4_score_quality --workdir data/stage_a --max-cost 15", "Chấm đầy đủ."], ["python -m src.stage_a.a5_embed --workdir data/stage_a", "Embedding đầy đủ."]]], ["6. Chẩn đoán khi mô hình trả lỗi 400", "Ngày 20/09/2026 qwen/qwen-2.5-72b-instruct trả lỗi 'does not support endpoint: completions' ở CẢ HAI nhà cung cấp. Đổi sang qwen/qwen2.5-vl-72b-instruct, cùng mô hình nền, đo lại cho 67,7% so với 69,8%.", [["python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('https://openrouter.ai/api/v1/models'))['data']; [print(m['id']) for m in d if 'qwen' in m['id'].lower()]\"", "Liệt kê tên mô hình đang có trên OpenRouter."]]]], "tuning": [["Bình thường, ba lô song song", "--workers 4", "12 yêu cầu đồng thời chia đều ba nhà cung cấp"], ["Một mô hình dạy, một tiến trình", "--workers 3", "Mặc định trong base.yaml. 8 luồng bị chặn tần su const D={"README.md": {"lines": 95, "role": "Cửa ngõ của repo, thứ người khác đọc đầu tiên.", "detail": "Viết lại ngày 20/09/2026. Gồm hàm mục tiêu, dòng chảy dữ liệu mười bước, cấu trúc thư mục, bảng phân công hai máy kèm lý do kỹ thuật, và bảng chốt cấu hình Giai đoạn A kèm căn cứ số liệu cho từng giá trị.", "note": "Khoá <code>tid</code> được nêu ngay đầu: mọi bảng nối với nhau qua nó, đổi định dạng là hỏng toàn bộ liên kết."}, ".gitignore": {"lines": 9, "role": "Danh sách thứ không đưa lên git.", "detail": "Chín dòng: <code>.env</code>, <code>.venv/</code>, <code>data/</code>, <code>outputs/</code>, <code>models/</code>, <code>__pycache__/</code>, <code>*.pyc</code>, <code>*.log</code>, <code>.DS_Store</code>, <code>unsloth_compiled_cache/</code>. Đã xác nhận bằng <code>git check-ignore .env data</code> và bằng việc quét toàn bộ lịch sử: chưa từng có commit nào chứa <code>.env</code> hay <code>data/</code>.", "note": "Đây là lý do khoá API không bị lộ khi repo chuyển sang công khai."}, "pyrightconfig.json": {"lines": 6, "role": "Cấu hình bộ kiểm tra kiểu của Pylance trong VS Code.", "detail": "Đặt <code>typeCheckingMode: basic</code> và tắt ba loại cảnh báo: <code>reportArgumentType</code>, <code>reportCallIssue</code>, <code>reportAttributeAccessIssue</code>. Tắt ba cái này vì các thư viện như transformers và google-genai thiếu chú thích kiểu, để bật sẽ hiện hàng trăm gạch đỏ giả.", "note": "Không ảnh hưởng tới lúc chạy, chỉ ảnh hưởng tới gạch đỏ trong trình soạn thảo."}, ".vscode/settings.json": {"lines": 3, "role": "Cấu hình riêng của VS Code cho dự án.", "detail": "Hai dòng, đặt conda làm trình quản lý môi trường và gói mặc định, khớp với việc bạn dùng conda trên máy Mac."}, "configs/base.yaml": {"lines": 105, "order": "cfg", "role": "Tham số dùng chung cho MỌI phương án. File cấu hình quan trọng nhất.", "detail": "Bảy nhóm khoá:\n<ul>\n<li><code>project</code>: seed rút mẫu 42, ba seed huấn luyện 42/43/44</li>\n<li><code>paths</code>: đường dẫn tương đối của mọi thư mục dữ liệu và đầu ra</li>\n<li><code>generation</code>: <code>prompt_id: rsr</code>, nhiệt độ 0,8, top-p 0,95, 3 mẫu mỗi mô hình dạy, 3 luồng, tối đa 6 lần thử</li>\n<li><code>quality</code>: alpha 0,5, bốn trọng số 0,30/0,20/0,25/0,25, và sáu từ khoá</li>\n<li><code>selection</code>: k=3, a=1, b=1, lambda 0,5, lưới lambda, ngưỡng cắt thứ hạng 100</li>\n<li><code>signal_direction</code>: chiều tối ưu từng tín hiệu</li>\n<li><code>training</code>, <code>hardware</code>, <code>eval</code>: QLoRA r=16 alpha=32, trần bộ nhớ 10GB, Acc@4</li>\n</ul>", "note": "Nhóm <code>signal_direction</code> tồn tại chỉ để ghi một việc: RSR là <b>min</b>, mọi thứ khác là <b>max</b>. Các giá trị đánh dấu [TẠM] là chưa có căn cứ, phải chốt bằng đo đạc."}, "configs/data.yaml": {"lines": 38, "order": "cfg", "role": "Thành phần dữ liệu và tên file chuẩn của Giai đoạn A.", "detail": "Ba phần:\n<ul>\n<li><code>data.train_composition</code>: 800 MATH mức 4, 600 mức 5, 400 mức 3, 200 GSM8K</li>\n<li><code>data.val</code>: 100 GSM8K + 100 MATH; <code>min_correct_per_question: 3</code>; loại trùng MATH-500</li>\n<li><code>stage_a_files</code>: tên chuẩn của tám file đầu ra, để mã không viết cứng tên file</li>\n</ul>\nĐầu file có khối chú thích mô tả lược đồ từng dòng của <code>questions.jsonl</code> và <code>trajectories.jsonl</code>. Đây là chỗ tra khi quên tên trường.", "note": "Nhờ <code>stage_a_files</code> mà lô pilot dùng chung mã với dữ liệu thật, chỉ khác thư mục."}, "configs/models.yaml": {"lines": 32, "order": "cfg", "role": "Tên mô hình và tên biến môi trường chứa khoá.", "detail": "Ba mô hình dạy qua OpenRouter (<code>deepseek/deepseek-chat</code>, <code>qwen/qwen-2.5-72b-instruct</code>, <code>meta-llama/llama-3.3-70b-instruct</code>), giám khảo Gemini 3.7 Flash kèm bản so sánh Flash-Lite, và embedding BGE-M3 chạy trên MPS.", "note": "<b>Không chứa khoá</b>, chỉ chứa <i>tên biến</i> (<code>OPENROUTER_API_KEY</code>, <code>GEMINI_API_KEY</code>). Khoá nằm trong <code>.env</code> ở gốc repo, đã bị git bỏ qua."}, "configs/method/qd_rsr.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Phương pháp của nhóm. Sẽ ghi a=1, b=1, lambda theo giá trị đã chốt, và chọn thuật toán greedy. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/rsr.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Bài gốc. Top-k theo RSR, chiều <b>min</b>. Đây là file duy nhất có chiều min. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/lark.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Baseline mạnh nhất ở quy mô 1,5 tỷ. Top-k theo điểm Brier từ logits, chiều max. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/grape.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Top-k theo xác suất sinh toàn cục, chiều max. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/local_naturalness.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Top-k theo xác suất ngữ cảnh cục bộ, chiều max. <b>Lưu ý tên</b>: khoá trong base.yaml là <code>local_nat</code>, tên file là <code>local_naturalness</code>, hai tên này phải được ánh xạ với nhau ở b2_select. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/token_length.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Top-k theo độ dài chuỗi, chiều max. Thêm ngày 17/09 để chứng minh QD-RSR không thắng nhờ chọn chuỗi dài. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/correct_only.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Chọn ngẫu nhiên trong các chuỗi đúng. Đọc candidates.jsonl. Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/method/no_filter.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau cùng với b2_select.", "detail": "Chọn ngẫu nhiên trong toàn bộ ứng viên kể cả chuỗi sai. <b>Là phương án duy nhất đọc trajectories.jsonl thay vì candidates.jsonl.</b> Mỗi file chỉ ghi phần khác biệt so với base.yaml, rồi được config.py gộp đè lên.", "note": "Viết bây giờ phải đoán tên khoá mà b2_select sẽ dùng, nên để cùng lúc với b2_select."}, "configs/ablation/fit_only.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "b=0, lambda=0. Chỉ còn Fit, tương đương RSR gốc. Không cần chạy thêm vì trùng với phương án RSR.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/ablation/quality_only.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "a=0, lambda=0. Chỉ còn Qual. Dùng để tái lập <i>xu hướng</i> của bài RSR rằng chất lượng riêng lẻ thua RSR, không phải tái lập con số.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/ablation/diversity_only.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "a=0, b=0. Chỉ còn Div. Đo đóng góp riêng của tính đa dạng.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/ablation/fit_quality.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "lambda=0. Có Fit và Qual, tắt Div. So với bản đầy đủ để biết Div đóng góp bao nhiêu.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/ablation/fit_diversity.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "b=0. Có Fit và Div, tắt Qual. So với bản đầy đủ để biết Qual đóng góp bao nhiêu.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/ablation/no_prefilter.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Sẽ viết ở tuần sau.", "detail": "Giữ cả ba thành phần nhưng bỏ bước lọc theo đáp án. Thêm 17/09 để kiểm chứng phát hiện ở Bảng 12 của bài RSR ở quy mô 1,5 tỷ.", "note": "Bảy dòng trong bảng ablation nhưng chỉ năm lần chạy thêm, vì fit_only và bản đầy đủ trùng với các phương án đã chạy."}, "configs/student/qwen1_5b.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Cấu hình mô hình học chính.", "detail": "Sẽ ghi tên mô hình Qwen2.5-1.5B, kích thước lô, và số bước tích luỹ gradient. Có số liệu công bố của LARK trên đúng mô hình này để đối chiếu.", "note": "Chưa chốt dùng bản Base hay Instruct. Quyết bằng cách chạy thử cả hai trên pilot rồi so thứ tự xếp hạng RSR."}, "configs/student/qwen7b.yaml": {"lines": 0, "empty": true, "role": "Rỗng. Cấu hình mô hình học phụ.", "detail": "Qwen2.5-7B, kiểm chứng phương pháp có giữ hiệu quả khi tăng quy mô. Dự kiến chạy trên Kaggle nếu vượt 10GB bộ nhớ.", "note": "Base hay Instruct phải theo cùng quyết định với mô hình 1,5 tỷ, để hai mốc so sánh được với nhau."}, "src/common/__init__.py": {"lines": 0, "empty": true, "role": "File rỗng, đánh dấu thư mục là gói Python.", "detail": "Đáng chú ý: <b>chỉ có thư mục common là có file này</b>. Các thư mục stage_a, stage_b, stage_c, tools và cả src đều không có. Mã vẫn chạy được nhờ cơ chế gói ngầm định của Python 3.3 trở lên.", "note": "Nên thêm cho đủ năm thư mục còn lại để nhất quán, hoặc bỏ luôn file này. Hiện không gây lỗi."}, "src/common/config.py": {"lines": 145, "order": "cfg", "role": "Đọc và gộp cấu hình YAML, nạp .env.", "detail": "Thứ tự gộp: base, data, models, student, method, ablation, rồi các <code>--override</code> trên dòng lệnh. Sáu hàm chính:\n<ul>\n<li><code>AttrDict</code>: cho phép gõ <code>cfg.selection.k</code>. Gõ sai tên khoá thì <b>báo lỗi ngay</b> kèm danh sách khoá có thật, thay vì trả None âm thầm</li>\n<li><code>deep_merge</code>: gộp đệ quy, dict thì gộp từng khoá, list thì thay hẳn</li>\n<li><code>load_env_file</code>: đọc .env mà không cần thư viện ngoài, không đè biến đã có</li>\n<li><code>parse_override</code>: biến chuỗi <code>selection.k=1</code> thành dict lồng nhau, giá trị đi qua YAML nên đúng kiểu</li>\n<li><code>resolve_path</code>: đường dẫn tương đối tính từ gốc repo</li>\n<li><code>signal_direction</code>: trả min hoặc max, báo lỗi nếu tín hiệu chưa được khai báo</li>\n</ul>", "note": "Đặt biến môi trường <code>QDRSR_ROOT</code> nếu chạy mã từ nơi khác gốc repo."}, "src/common/io_utils.py": {"lines": 138, "order": "cfg", "role": "Đọc ghi jsonl an toàn, và định nghĩa khoá tid.", "detail": "<code>tid = qid|teacher|sample_idx</code> là khoá nối MỌI bảng trong dự án. <code>split_tid</code> dùng <code>rsplit</code> nên qid được phép chứa dấu gạch đứng.\n<ul>\n<li><code>JsonlWriter</code>: ghi nối tiếp, có khoá luồng, flush và fsync sau mỗi dòng. Mỗi dòng tốn tiền API nên thà chậm vài mili giây còn hơn mất tiến độ. Nếu lần chạy trước bị cắt giữa dòng thì tự thêm xuống dòng trước khi ghi tiếp</li>\n<li><code>write_jsonl</code> và <code>write_json</code>: ghi nguyên tử qua file tạm rồi đổi tên, không để lại file dở dang</li>\n<li><code>iter_jsonl</code>: dòng cuối hỏng thì bỏ qua kèm cảnh báo (do tiến trình bị ngắt), dòng hỏng ở giữa thì báo lỗi thật</li>\n<li><code>load_done_keys</code>: tập khoá đã có, dùng để bỏ qua phần đã làm khi chạy lại</li>\n</ul>", "note": "Không được đổi định dạng tid. Đổi là hỏng toàn bộ liên kết giữa các bảng."}, "src/common/answers.py": {"lines": 208, "order": "cfg", "role": "Tách, chuẩn hoá và so khớp đáp án theo quy ước MATH và PRM800K.", "detail": "Ba tầng:\n<ul>\n<li><code>last_boxed</code>: tìm <code>\\boxed{}</code> hoặc <code>\\fbox{}</code> <b>cuối cùng</b>, đếm ngoặc lồng nhau, bỏ qua ngoặc đã thoát. Trả None nếu rỗng hoặc chưa đóng ngoặc (chuỗi bị cắt)</li>\n<li><code>normalize_answer</code>: khoảng hai mươi phép chuẩn hoá, gồm bỏ đơn vị, bỏ ký hiệu độ và phần trăm, đổi tfrac và dfrac thành frac, sửa phân số thiếu ngoặc, bỏ dấu phẩy ngăn nghìn, cắt vế trái ngắn của dấu bằng</li>\n<li><code>is_equiv</code>: so chuỗi đã chuẩn hoá, nếu khác thì thử so hai số hữu tỉ chính xác qua <code>Fraction</code></li>\n<li><code>grade</code>: trả về đúng/sai kèm lý do là match, mismatch hoặc no_boxed</li>\n</ul>", "note": "<b>Không có bước sympy</b> như bộ chấm gốc, nên hai biểu thức đúng nhưng viết khác thứ tự bị chấm sai. Đã đối chiếu với 1189 nhãn pilot cũ: khớp 1188, chỗ lệch duy nhất là số thập phân xấp xỉ của phân số 37/101, và bộ chấm mới đúng về mặt số học."}, "src/common/api.py": {"lines": 210, "order": "cfg", "role": "Gọi OpenRouter, thử lại, đếm token và chi phí.", "detail": "<ul>\n<li><code>EmptyResponse</code>: lỗi riêng cho trường hợp nhà cung cấp trả mã 200 nhưng choices là None hoặc content rỗng. Đây là lỗi hay gặp với Qwen2.5-72B, khoảng 5% lượt</li>\n<li><code>UsageTracker</code>: bộ đếm dùng chung cho mọi luồng, có khoá luồng</li>\n<li><code>ChatClient.chat</code>: thử lại bằng tenacity với chờ tăng dần ngẫu nhiên tới 30 giây. BadRequest chỉ thử 2 lần, các lỗi khác thử đủ 6 lần. Lỗi xác thực và không tìm thấy thì không thử lại</li>\n<li>SDK được đặt <code>max_retries=0</code> để chỉ tenacity thử lại, tránh nhân đôi số lượt gọi</li>\n</ul>", "note": "<b>Sửa lỗi của mã pilot cũ</b>: bộ đếm chỉ tăng SAU KHI phản hồi đã kiểm tra hợp lệ. Mã cũ tăng trước khi đọc choices[0] nên lượt lỗi bị đếm nhầm là thành công."}, "src/common/prompts.py": {"lines": 121, "order": "cfg", "role": "Mọi prompt của dự án nằm ở một chỗ.", "detail": "Ba nhóm:\n<ul>\n<li><code>build_generation_messages</code> với hai chế độ. <b>rsr</b>: một tin nhắn user duy nhất, đề bài nối thêm <code>Return your final response within \\boxed{}.</code>, không có system prompt, đúng Phụ lục A.2 của bài gốc. <b>boxed</b>: cách cũ, giữ để sinh bù cho lô pilot chạy trước ngày 19/09</li>\n<li><code>SYSTEM_PROMPT_TRAIN</code>: câu <code>Please reason step by step...</code>, dùng lúc huấn luyện và đánh giá, không dùng lúc sinh</li>\n<li><code>JUDGE_PROMPT</code> và <code>build_judge_prompt</code>: nguyên văn Bảng 30 của bài RSR, giữ cả bảng neo điểm năm mức lẫn đoạn chống lạm phát điểm. Thêm khối lời giải tham chiếu theo GenRM, và khối này bị bỏ hẳn nếu câu hỏi không có lời giải chuẩn</li>\n</ul>", "note": "Bài gốc dùng <b>hai câu khác nhau ở hai giai đoạn khác nhau</b>. Ghi nhận ngày 17/09 từng lấy nhầm một câu và đặt sai chỗ, đã sửa ngày 19/09."}, "src/common/rule_score.py": {"lines": 92, "order": "cfg", "role": "Điểm chất lượng theo quy tắc, tái lập bộ lọc LIMO theo Phụ lục B.2.", "detail": "Bốn tiêu chí: Elaborated reasoning 30% (tổng số từ), Self-Verification 20% (check, verify), Exploratory Approach 25% (perhaps, might), Adaptive Granularity 25% (therefore, since).\n<br><br>Ba bước theo đúng B.2: đếm số lần xuất hiện, chia cho tổng số từ để ra tần suất tương đối, rồi chuẩn hoá z-score <b>riêng từng tiêu chí</b> trước khi cộng theo trọng số.\n<br><br>Ba chỗ bài gốc không nói rõ, đề tài tự quyết và ghi lại trong docstring: tách từ bằng <code>\\b\\w+\\b</code> và chữ thường hoá; chỉ đếm từ nguyên vẹn nên <code>checking</code> không tính là <code>check</code>; tiêu chí đầu dùng thẳng số tuyệt đối còn ba tiêu chí sau dùng tần suất, sau z-score cả bốn về cùng thang.", "note": "z-score tính trên <b>toàn bộ tập</b>, nên phải chấm cả tập một lượt. Chấm từng phần rồi ghép sẽ ra kết quả khác. Đây là lý do quality.jsonl luôn được tính lại từ đầu."}, "src/stage_a/a1_prepare.py": {"lines": 280, "order": "A1", "role": "Dựng kho câu hỏi: tải dữ liệu, loại trùng MATH-500, tách tập kiểm định, rút 2.000 câu.", "detail": "Thay cho hai file cũ <code>prepare_train_pools.py</code> và <code>verify_dedup.py</code>, giữ nguyên mọi quy ước đã kiểm chứng: hàm <code>norm</code> chỉ gộp khoảng trắng và đổi chữ thường; qid dạng <code>math_00000</code> theo vị trí sau loại trùng và <code>gsm8k_00000</code> theo chỉ số gốc; tập kiểm định rút bằng seed 42, GSM8K trước MATH sau.\n<br><br><b>Đầu ra</b>: <code>data/raw/gsm8k_pool.jsonl</code> 7.273 câu, <code>math_pool.jsonl</code> 7.398 câu, <code>validation.jsonl</code> 200 câu, <code>build_manifest.json</code>, và <code>data/stage_a/questions.jsonl</code> 2.000 câu.", "note": "<b>Ba cơ chế an toàn</b>: phép thử đối chứng chạy mỗi lần, hàm loại trùng phải bắt đúng 500/500 trên tập test của MATH, không thì dừng ngay; cổng tái lập so danh sách qid với bản cũ, lệch thì dừng chứ không ghi đè, phải dùng <code>--force</code>; và in ra các câu bị bỏ vì <code>\\boxed{}</code> rỗng (có đúng 2 câu: math_05341 và math_05343)."}, "src/stage_a/a2_generate.py": {"lines": 226, "order": "A2", "role": "Sinh chuỗi suy luận từ ba mô hình dạy qua OpenRouter. Chạy trên máy Mac.", "detail": "<b>Đọc</b> questions.jsonl. <b>Ghi</b> trajectories.jsonl (mỗi chuỗi thành công một dòng, ghi ngay), failures.jsonl (lượt thất bại sau khi hết số lần thử), generation_runs.jsonl (một dòng mỗi lần chạy: mô hình, tham số, hình dạng prompt, thời điểm).\n<br><br><code>build_tasks</code> xếp mọi mẫu của một câu hỏi liền nhau, nên nếu dừng giữa chừng thì phần đã xong là các câu hỏi trọn vẹn chứ không phải một mẩu của mọi câu.\n<br><br>Cờ hữu ích: <code>--dry-run</code> đếm việc và in prompt mẫu mà không gọi API, <code>--limit-questions</code> chạy thử vài câu, <code>--max-cost</code> chặn ngân sách, <code>--teachers</code> chỉ chạy một mô hình.", "note": "Chạy lại đúng lệnh cũ sẽ bỏ qua tid đã có và chỉ sinh bù phần thiếu, kể cả các lượt từng lỗi. Nếu đặt --max-cost mà OpenRouter không trả chi phí thì chương trình cảnh báo sau 10 lượt đầu."}, "src/stage_a/a3_filter.py": {"lines": 168, "order": "A3", "role": "Gán nhãn đúng sai, lọc sơ bộ, và in thống kê.", "detail": "<b>Ba đầu ra khác vai trò</b>:\n<ul>\n<li><code>labels.jsonl</code>: MỌI chuỗi, không kèm văn bản, có tid, đúng sai, đáp án tách được, lý do</li>\n<li><code>candidates.jsonl</code>: chỉ chuỗi ĐÚNG của các câu được giữ, kèm văn bản. Đây là đầu vào của a4, a5 và b1. Là file dẫn xuất, xoá đi chạy lại a3 là có lại</li>\n<li><code>kept_qids.json</code>: danh sách câu hỏi được giữ, cố định cho mọi phương án</li>\n<li><code>stats.json</code>: thống kê, cũng là số liệu cho Hình 2 của paper</li>\n</ul>\nBảng in ra gồm tỷ lệ đúng theo mô hình dạy, và phân bố số chuỗi đúng mỗi câu theo từng nhóm độ khó.", "note": "<b>Chuỗi bị cắt luôn tính là sai</b> dù có \\boxed, vì chuỗi cụt không làm mẫu huấn luyện được. <b>Dừng lại nếu có câu thiếu chuỗi</b>, bắt sinh bù trước, để bộ ứng viên đồng đều giữa các phương án. Dùng --allow-incomplete để bỏ qua."}, "src/stage_a/a4_score_quality.py": {"lines": 262, "order": "A4", "role": "Chấm Qual(t) = alpha × rule_score + (1 − alpha) × llm_score.", "detail": "<b>Đọc</b> candidates.jsonl và questions.jsonl. <b>Ghi</b> judge.jsonl (ghi dần, chạy bù được) và quality.jsonl (tính lại toàn bộ mỗi lần).\n<ul>\n<li><code>parse_judge_json</code>: chịu được dấu ```json bọc ngoài và chữ thừa hai đầu, kiểm tra overall_score nằm trong [0,1], ghi lại tiêu chí nào bị giám khảo bỏ sót</li>\n<li><code>GeminiJudge</code>: gọi qua google-genai, thử lại 4 lần, đếm lượt và thời gian để ước chi phí</li>\n<li><code>combine</code>: ghép rule và judge, chuỗi chưa chấm thì để trống thay vì đoán</li>\n</ul>\nCờ: <code>--rule-only</code> không gọi API, <code>--limit</code> chấm thử N chuỗi, <code>--judge-model</code> và <code>--out</code> để so Flash với Flash-Lite, <code>--no-reference</code> bỏ lời giải tham chiếu.", "note": "Điểm qual ở đây <b>chưa chuẩn hoá</b> về [0,1]. Bước min-max theo từng câu hỏi diễn ra ở b2_select. <b>Chưa có --max-cost</b>, sẽ thêm trước khi chạy 18.000 chuỗi."}, "src/stage_a/a5_embed.py": {"lines": 167, "order": "A5", "role": "Tính vector BGE-M3 và đo phân bố khoảng cách. Chạy trên máy Mac, thiết bị MPS.", "detail": "<b>Ghi</b> embeddings.npz (vector đã chuẩn hoá L2 kèm danh sách tid theo đúng thứ tự) và embed_probe.json.\n<br><br>Hàm <code>probe</code> tách khoảng cách thành ba nhóm để so sánh: trong cùng câu hỏi, giữa hai chuỗi cùng một mô hình dạy, và giữa hai mô hình dạy khác nhau.", "note": "<b>Cờ --probe trả lời hai câu còn mở cùng lúc.</b> Cột trong cùng câu hỏi: nếu p25 và p75 sát nhau thì biểu diễn toàn chuỗi không phân biệt được, phải chuyển sang biểu diễn theo bước (Feng đo được phân bố dồn vào 0,00-0,04 trên Long-CoT). Tỷ lệ khác mô hình dạy chia cùng mô hình dạy: nếu gần 1 thì nhiệt độ 0,8 đang tạo đủ khác biệt, nếu lớn thì hạ xuống 0,6 ít rủi ro hơn."}, "src/stage_b/b1_fit.py": {"lines": 0, "empty": true, "order": "B1", "role": "Rỗng. Tính bốn tín hiệu nội tại. Chạy trên máy Windows, RTX 3060.", "detail": "Tính RSR, GRAPE, Local Naturalness và LARK <b>trong cùng một lượt forward pass</b>, vì cả bốn đều đọc từ cùng bộ logits. RSR là tỷ lệ giữa tổng thứ hạng token đã cắt ngưỡng 100 và tổng xác suất âm log. LARK là điểm Brier tính trực tiếp từ logits.", "note": "Bắt buộc cùng máy với b3_train: độ chính xác số học giữa MPS và CUDA lệch nhau có thể làm đổi thứ tự xếp hạng chuỗi. Đây cũng là file nên kèm phép kiểm chứng bằng ví dụ số tự tạo, để trả lời câu hỏi dựa vào đâu mà tin kết quả đúng."}, "src/stage_b/b2_select.py": {"lines": 0, "empty": true, "order": "B2", "role": "Rỗng. Chọn k chuỗi cho mỗi câu, cho cả tám phương án.", "detail": "Thuật toán greedy cho QD-RSR: mỗi vòng chọn chuỗi tối đa hoá <code>Fit^a × Qual^b + lambda × [Div(S ∪ {t}) − Div(S)]</code>, trong đó độ lợi biên của Div chính là khoảng cách tới chuỗi gần nhất đã chọn. Bảy phương án còn lại chỉ là top-k theo một điểm.", "note": "<b>Ba chỗ dễ sai</b>: chiều tối ưu (RSR min, còn lại max); chuẩn hoá min-max theo từng câu hỏi diễn ra ở đây chứ không phải ở a4; và No-Filter đọc trajectories.jsonl chứ không phải candidates.jsonl."}, "src/stage_b/b3_train.py": {"lines": 0, "empty": true, "order": "B3", "role": "Rỗng. Tinh chỉnh QLoRA 4-bit. Chạy trên máy Windows.", "detail": "QLoRA r=16, alpha=32, dropout 0,05, tốc độ học 1e-4 lịch trình cosine, 3 epoch, độ dài tối đa 2048 token, ba seed. Dự kiến dùng Unsloth hoặc LLaMA-Factory.", "note": "Đây là nơi dùng SYSTEM_PROMPT_TRAIN, câu thứ hai trong prompts.py, khác với câu dùng lúc sinh chuỗi. Nguyên tắc bộ nhớ: không để chiếm quá 10GB dù card có 12GB."}, "src/stage_c/c1_evaluate.py": {"lines": 0, "empty": true, "order": "C1", "role": "Rỗng. Đánh giá trên sáu bộ benchmark.", "detail": "GSM8K, MATH-500, AMC, AIME 2024, AIME 2025, BBH. Chỉ số chính Acc@4: mỗi câu trả lời bốn lần độc lập, tính đúng nếu có ít nhất một lần đúng. Báo cáo song song Acc@1.", "note": "Acc@4 là bắt buộc chứ không phải tuỳ chọn: lợi ích của tính đa dạng chỉ hiện ở pass@k, nếu dùng độ chính xác đơn thì thành phần Div không đo được gì và giả thuyết H4 không kiểm chứng được."}, "src/stage_c/c2_deploy.py": {"lines": 0, "empty": true, "order": "C2", "role": "Rỗng. Đóng gói và đo chỉ số triển khai thực tế.", "detail": "Hợp nhất LoRA vào mô hình gốc, chuyển sang định dạng GGUF, lượng tử 4-bit, chạy trên Ollama hoặc LM Studio. Đo tốc độ sinh token, dung lượng bộ nhớ, thời gian phản hồi.", "note": "Nhóm chỉ số này là một phần của Đóng góp 5, và là nhóm dữ liệu mà các công trình đối chứng không báo cáo."}, "src/tools/test_api.py": {"lines": 88, "order": "T", "role": "Kiểm tra bốn mô hình còn gọi được. Chạy trước mỗi giai đoạn lớn.", "detail": "Gọi ba mô hình dạy qua <b>đúng lớp ChatClient và đúng prompt</b> mà a2 sẽ dùng, nên lỗi lộ ra ở đây chứ không lộ giữa lúc sinh 18.000 chuỗi. Gọi Gemini bằng cùng cách với file cũ. In chi phí từng lượt để xác nhận cờ request_usage_cost hoạt động.", "note": "Có lúc báo <code>có \\boxed: KHÔNG</code> với DeepSeek. Đó là do DeepSeek viết dài, bị cắt ở 400 token trước khi kịp viết \\boxed, không phải mô hình không nghe prompt. Bằng chứng: trong lô thử thật nó đạt 6/6 đúng đều có \\boxed."}, "src/tools/convert_old_pilot.py": {"lines": 73, "order": "T", "role": "Chuyển hai file câu hỏi pilot cũ sang lược đồ mới.", "detail": "Giữ nguyên qid cũ (<code>gsm8k_pilot_000</code>, <code>mathpilot_000</code>) để so sánh đúng trên những câu đã đo 96,7% và 62,7%. Đổi tên trường <code>gold_answer</code> thành <code>gold</code>, chuyển <code>Level 4</code> thành số nguyên 4, xáo trộn cố định bằng seed 42 để <code>--limit-questions</code> luôn lấy mẫu trộn GSM8K và MATH.", "note": "Cảnh báo nếu trường answer cũ khác đáp án tách từ lời giải, và khi đó ưu tiên đáp án tách từ lời giải. Không đụng vào file pilot cũ."}, "src/tools/check_grader.py": {"lines": 116, "order": "T", "role": "Đối chiếu bộ chấm mới với nhãn pilot cũ.", "detail": "Hai phép so tách riêng vì kiểm tra hai thứ khác nhau:\n<ul>\n<li><b>Phép 1, quan trọng</b>: so <code>is_equiv(pred, gold)</code> với nhãn <code>is_correct</code> cũ. Chỉ dùng hai trường đã tách sẵn nên không phụ thuộc prompt cũ dùng <code>####</code> hay <code>\\boxed</code>. Đây là phép đo đúng phần thiếu sympy</li>\n<li><b>Phép 2, tham khảo</b>: so <code>last_boxed</code> với pred_answer cũ, chỉ trên chuỗi thật sự có \\boxed</li>\n</ul>", "note": "Kết quả thực tế: phép 1 khớp 1188/1189 (99,9%), lệch duy nhất là 0,3663366... so với 37/101. Phép 2: 82,3% chuỗi cũ không có \\boxed vì dùng prompt cũ, 211 chuỗi còn lại khớp 100%."}, "src/tools/prepare_train_pools.py": {"lines": 106, "legacy": true, "role": "Mã cũ, đã bị a1_prepare.py thay thế.", "detail": "Bản đầu tiên của bước chuẩn bị dữ liệu. Đã được chuyển vào thư mục tools và giữ lại để tham chiếu. Chỗ khác biệt: nó chỉ loại trừ pilot GSM8K qua orig_index, không loại pilot MATH; và không kiểm tra câu nào không tách được đáp án, nên để lọt 2 câu có \\boxed rỗng vào pool.", "note": "Docstring của hàm norm ghi sai, nói là bỏ ký tự không phải chữ số, nhưng thực ra chỉ gộp khoảng trắng và đổi chữ thường. Hàm chạy đúng, chỉ chú thích sai."}, "src/tools/verify_dedup.py": {"lines": 26, "legacy": true, "role": "Mã cũ, phép thử đối chứng loại trùng MATH-500.", "detail": "Chạy hàm loại trùng trên cả tập test và tập train của MATH, kỳ vọng test trùng gần 500 câu còn train trùng 0 câu. Nếu test cũng ra 0 thì hàm so khớp hỏng.", "note": "Logic này đã được đưa thẳng vào a1_prepare.py và chạy mỗi lần gọi, nên không thể âm thầm hỏng nữa. File này giữ lại để đối chiếu."}, "src/tools/inspect_rsr_ref.py": {"lines": 0, "empty": true, "role": "Rỗng. Khảo sát dữ liệu công khai của bài gốc.", "detail": "Sẽ đọc tập <code>Umean/RSR_data</code> tải về <code>data/rsr_ref/</code>. Bốn số liệu đã khảo sát bằng tay ngày 17/09 và cần được tái lập bằng mã: độ dài trung bình 7.754 token, 100% chuỗi có thẻ think, chuỗi được chọn dài gấp 4,9 lần chuỗi của mô hình dạy ngắn nhất, mô hình đó chỉ thắng 2/4948 bài.", "note": "Cần cho phần Thảo luận và phần Hạn chế của paper."}, "src/tools/make_figures.py": {"lines": 0, "empty": true, "role": "Rỗng. Vẽ hình cho paper.", "detail": "Hình 2 là phân bố số chuỗi đúng mỗi câu theo độ khó, số liệu lấy từ stats.json của a3. Hình 3 là so sánh kết quả giữa các phương án, số liệu lấy từ outputs/results.", "note": "Viết ở Giai đoạn 4, sau khi có kết quả."}, "tests/common/test_answers.py": {"lines": 77, "tests": 38, "order": "TEST", "role": "Kiểm thử bộ chấm đáp án. Nhiều bài nhất trong dự án.", "detail": "Bốn nhóm:\n<ul>\n<li><code>last_boxed</code> 10 trường hợp: \\boxed thường, ngoặc lồng nhau, hai \\boxed lấy cái cuối, ngoặc đã thoát, \\boxed không ngoặc, \\fbox, rỗng, bị cắt giữa chừng, không có, và None</li>\n<li>16 cặp phải coi là bằng nhau: 1/2 với 0.5, dfrac với frac, có ký hiệu đô la, có đơn vị, có dấu phẩy ngăn nghìn, có ký hiệu độ và phần trăm, x=5 với 5, .5 với 0.5</li>\n<li>7 cặp phải coi là khác nhau, gồm 3.14159 với 3.14 và (1,2) với (2,1)</li>\n<li>Ba lý do chấm, tách đáp án chuẩn hai nguồn, và tính bất biến của chuẩn hoá</li>\n</ul>", "note": "Bài cuối kiểm tra chuẩn hoá hai lần cho kết quả giống một lần, tránh lỗi chuẩn hoá lặp làm hỏng chuỗi."}, "tests/stage_a/test_a2_a3_pipeline.py": {"lines": 245, "tests": 10, "order": "TEST", "role": "Mô phỏng nguyên luồng a2 và a3 bằng client giả, không cần mạng.", "detail": "Đây là bài kiểm thử đáng đọc nhất nếu muốn hiểu dòng chảy. <code>FakeClient</code> đóng vai ChatClient, quyết định kết quả theo mô hình và đề bài nên tái lập được: deepseek luôn sai, hai mô hình kia luôn đúng.\n<ul>\n<li>Cấu hình gộp đúng, chiều tối ưu đúng, tổng bốn trọng số bằng 1, gõ sai khoá thì báo lỗi</li>\n<li>Prompt mặc định đúng công thức A.2: một tin nhắn user, kết thúc bằng Return your final response, không có system</li>\n<li>Prompt cũ vẫn gọi được, prompt không tồn tại thì báo lỗi</li>\n<li><b>Chạy bù</b>: cho một lượt lỗi, kiểm tra a3 dừng vì thiếu chuỗi, chạy lại a2 sinh đúng 1 tid còn thiếu, chạy lần ba thì không còn việc</li>\n<li>Chuỗi bị cắt tính là sai, chuỗi không có \\boxed cho lý do no_boxed</li>\n<li>Chốt ngân sách dừng đúng lúc</li>\n<li>--dry-run không gọi API và không tạo file</li>\n<li>JsonlWriter ghi tiếp được sau khi file bị cắt giữa dòng</li>\n</ul>", "note": "Bài chạy bù là bài quan trọng nhất, vì nó chứng minh việc mất tiến độ giữa chừng không gây mất dữ liệu hay sinh trùng."}, "tests/stage_a/test_a1_prepare.py": {"lines": 108, "tests": 7, "order": "TEST", "role": "Kiểm thử phần thuần của a1, không cần mạng.", "detail": "<ul>\n<li><code>parse_level</code> xử lý được Level 4, Level ?, chuỗi rỗng và None</li>\n<li><code>norm</code> giữ nguyên hành vi bản cũ</li>\n<li><b>Tính ổn định của qid</b>: câu không tách được đáp án bị bỏ nhưng vẫn chiếm số thứ tự, nên qid của các câu còn lại không nhảy</li>\n<li><b>Tái lập thuật toán cũ</b>: so trực tiếp kết quả <code>split_validation</code> với đoạn mã <code>random.seed(42); sample; sample</code> của bản cũ, phải ra danh sách qid giống hệt</li>\n<li>Rút tập huấn luyện không phụ thuộc thứ tự file, đúng thành phần, tiền tố là mẫu trộn, và ba trường hợp rò rỉ đều bị bắt</li>\n<li>So sánh với bản cũ phân biệt được ba trạng thái: khớp hoàn toàn, cùng tập nhưng khác thứ tự, và lệch thật</li>\n</ul>", "note": "Bài tái lập thuật toán cũ là lý do mình dám khẳng định bản mới cho kết quả giống bản cũ, thay vì chỉ hy vọng."}, "tests/common/test_rule_score.py": {"lines": 62, "tests": 8, "order": "TEST", "role": "Kiểm thử điểm chất lượng theo quy tắc.", "detail": "<ul>\n<li>Đếm từ khoá và tổng số từ đúng</li>\n<li><b>Dạng biến thể không được tính</b>: checking, checked, verifies đều cho 0</li>\n<li>Chuỗi rỗng không làm chương trình đổ</li>\n<li>Chuẩn hoá theo tần suất khiến lời giải ngắn và dài có cùng tỷ lệ từ khoá cho cùng điểm</li>\n<li>z-score xử lý đúng ba trường hợp biên: danh sách rỗng, mọi giá trị bằng nhau (không chia cho 0), và tổng bằng 0</li>\n<li>Dày từ khoá thắng dài suông; mọi chuỗi giống hệt nhau thì mọi điểm bằng 0</li>\n<li>Trọng số không cộng thành 1, hoặc trọng số cho tiêu chí không có cách đo, đều bị báo lỗi</li>\n</ul>"}, "tests/stage_a/test_a4_quality.py": {"lines": 142, "tests": 22, "order": "TEST", "role": "Kiểm thử phần chấm chất lượng và prompt giám khảo.", "detail": "<ul>\n<li>Đọc JSON sạch, lấy đúng overall_score và năm tiêu chí</li>\n<li><b>Bốn kiểu bọc ngoài</b> đều đọc được: ```json, ``` trơn, có chữ thừa hai đầu, có khoảng tr
